[package]
name = "mylar3"
version = "0.1.0"
edition = "2021"
description = "Mylar3 comic book (CBR/CBZ) downloader & manager — orca service-backend"

[package.metadata.orca]
category = "downloads"

[lib]
name = "mylar3"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "mylar3"
path = "src/main.rs"

[dependencies]
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", branch = "main", package = "orca-plugin-toolkit", default-features = false, features = ["tools", "db", "http"] }
getrandom = "0.3"

[dev-dependencies]
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", branch = "main", package = "orca-plugin-toolkit", default-features = false, features = ["tools", "db", "http"] }
tokio    = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
wiremock = "0.6"

[lints.clippy]
let_underscore_must_use = "deny"
