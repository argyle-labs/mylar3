[package]
name = "mylar3"
version = "0.1.0"
edition = "2021"
description = "Mylar3 comic book (CBR/CBZ) downloader & manager — orca service-backend"

[package.metadata.orca]
category = "downloads"

[lib]
name = "mylar3"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "mylar3"
path = "src/main.rs"

[dependencies]
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", branch = "main", package = "orca-plugin-toolkit", default-features = false, features = ["tools", "db", "delegated-http"] }
getrandom = "0.3"
url = "2"

[dev-dependencies]
tokio    = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints.clippy]
let_underscore_must_use = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = "s"
