[package]
name = "mylar3"
version = "0.1.0"
edition = "2021"
description = "Mylar3 comic book (CBR/CBZ) downloader & manager — orca service-backend"

[package.metadata.orca]
category = "downloads"

[lib]
name = "mylar3"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "mylar3"
path = "src/main.rs"

# mylar3 registers a ServiceBackend plus its `mylar3.` endpoint and
# detect/remediate tools over the orca socket, reaching orca through
# plugin-toolkit alone.
[dependencies]
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", branch = "main" }

[dev-dependencies]
plugin-toolkit = { git = "https://github.com/argyle-labs/orca", branch = "main" }
tokio    = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
wiremock = "0.6"

[lints.clippy]
let_underscore_must_use = "deny"
