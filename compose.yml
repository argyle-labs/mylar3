# Mylar3 - comic book library manager
# docs: docs/mylar3.md

services:
  mylar3:
    image: lscr.io/linuxserver/mylar3:${MYLAR3_IMAGE_TAG:-latest}
    container_name: mylar3
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    ports:
      - "${MYLAR3_PORT:-8090}:8090"
    volumes:
      - ${MYLAR3_CONFIG_PATH:-./config}:/config
      - ${COMICS_PATH:-/path/to/comics}:/comics
    restart: unless-stopped
